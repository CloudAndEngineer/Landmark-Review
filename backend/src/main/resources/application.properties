spring.application.name=review-service

# Gemini API URL (기본값 제공)
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}

# Gemini API Key (환경 변수가 없으면 빈 값 또는 오류 발생)
gemini.api.key=${GEMINI_API_KEY}

# Kakao API Key
kakao.api.key=${KAKAO_API_KEY}
kakao.api.url=https://dapi.kakao.com
